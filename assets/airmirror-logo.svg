<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">AirMirror</title>
  <desc id="description">圆形徽章中的 iPhone 和 Windows 笔记本电脑。</desc>
  <defs>
    <linearGradient id="background" x1="92" y1="72" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FEFF"/><stop offset="1" stop-color="#D8EFF1"/>
    </linearGradient>
    <linearGradient id="phoneGlass" x1="132" y1="150" x2="236" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCF9FB"/><stop offset=".5" stop-color="#8DCBD3"/><stop offset="1" stop-color="#508DA0"/>
    </linearGradient>
    <linearGradient id="computerGlass" x1="276" y1="189" x2="413" y2="337" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8FBFC"/><stop offset="1" stop-color="#ADD2D9"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="231" fill="url(#background)"/>
  <circle cx="256" cy="256" r="231" fill="none" stroke="#153557" stroke-width="13"/>

  <!-- iPhone -->
  <rect x="98" y="129" width="132" height="247" rx="31" fill="#173454" stroke="#153557" stroke-width="10"/>
  <rect x="112" y="151" width="104" height="188" rx="18" fill="url(#phoneGlass)"/>
  <rect x="148" y="140" width="32" height="8" rx="4" fill="#153557"/>
  <path d="M124 281c29-4 54-28 73-65" fill="none" stroke="#F7FFFF" stroke-linecap="round" stroke-width="14" opacity=".72"/>
  <circle cx="164" cy="356" r="9" fill="#A8D3D7"/>

  <!-- 笔记本电脑 -->
  <rect x="267" y="177" width="158" height="147" rx="14" fill="#F6FFFF" stroke="#153557" stroke-width="10"/>
  <rect x="282" y="193" width="128" height="109" rx="6" fill="url(#computerGlass)"/>
  <path d="M250 327h192l31 47H219z" fill="#D7A06B" stroke="#153557" stroke-linejoin="round" stroke-width="10"/>
  <path d="M282 341h128l16 18H266z" fill="#153557"/>
  <path d="M331 359h47l-7 10h-33z" fill="#F1D09A"/>

  <!-- 被镜像的手机画面 -->
  <rect x="325" y="211" width="42" height="69" rx="8" fill="#F8FFFF" stroke="#153557" stroke-width="7"/>
  <path d="M338 219h16" stroke="#153557" stroke-linecap="round" stroke-width="5"/>
  <path d="M331 259c11-2 20-10 30-22" fill="none" stroke="#8EC6CE" stroke-linecap="round" stroke-width="10" opacity=".76"/>
</svg>
